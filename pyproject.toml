[project]
name = "nontainer-studio"
version = "0.0.1"
description = "A local AI workbench over nontainer: chat, versioned workspaces, live app preview."
readme = "README.md"
license = "MIT"
authors = [
    {name = "ashenfad"},
]
requires-python = ">=3.10"
dependencies = [
    # 0.3.1: preload_grants and warm_view_workers — the two knobs
    # `_python_config` now sets. Both ride on sandtrap 0.3's forkserver
    # broker (workers no longer fork from THIS uvicorn process, which
    # is what made a multi-threaded host a hang risk), and 0.3.1 is the
    # floor that carries sandtrap >= 0.3.2, where the factory can
    # finally reach preload_grants at all.
    # 0.2.1 brought delete_workspace (session teardown is nontainer's,
    # so kvgit is only transitive here); 0.2.0 the workspace root
    # contract (files at /workspace across executors).
    #
    # 0.3.3 is the floor studio needs NEXT rather than now: it adds
    # AppsConfig.static_assets — host files served with an app but
    # absent from the workspace — which is how the vendored frontend
    # stack (and an air-gapped deployment) gets built. It also carries
    # two things studio gets for free: test_app page errors attributed
    # to the agent's own file rather than the top of a vendored bundle,
    # and a fork that keeps its workspace's mounts, which matters here
    # because publish() IS a fork.
    # 0.3.4 makes the frontend-library block replaceable
    # (AppsConfig.frontend_notes). Studio vendors plotly and tailwind, so
    # it must be able to say so INSTEAD of nontainer's default block —
    # which names esm.sh and cdn.jsdelivr, and says "copy this exactly".
    # Appending a correction under that would lose.
    # 0.3.5 moved the served CSP onto AppsConfig, and test_app now SENDS
    # it during verification. Studio overrides the policy
    # (NONTAINER_STUDIO_CSP), so before this it verified under one policy
    # and served under another.
    # 0.3.6 fixes an assert that stopped retrying under that policy --
    # which broke every app that settles after a fetch, i.e. the shape
    # of the MUI reference app below.
    # 0.4.0 materializes rich `ui` values in run_python itself rather
    # than in the agno adapter, so an artifact is written on every rung
    # and `ui["chart"]` reads back as an ArtifactPath. Studio reads the
    # `[ui artifacts: ...]` note rather than the namespace, so the
    # breaking half does not reach it -- but the VM rung needs the
    # guest-side hook layered in (see _vm_config).
    # 0.4.1 renders a LONE callout as a card row. Studio is where that
    # surfaced: an agent wrote one caveat as a single tagged dict
    # instead of a one-item list, and it rendered as raw JSON with no
    # note explaining why. The floor moves so a studio install cannot
    # reproduce it.
    # 0.5.1 brings the agno session db (KvgitStoreDb), fork_session, and
    # seed -- the conversation stored in the branch with the files.
    "nontainer[agno,apps]>=0.5.1",
    # session identity is a minted slug (sleepy-meerkat), never a
    # typed name — the label the human reads is the title
    "petname>=2.6",
    "uvicorn>=0.30",
    # agno's SqliteDb requires sqlalchemy; it is what the pre-branch chat
    # store was written with, and reading one is how those conversations
    # move into their workspace
    "sqlalchemy>=2",
    # the agent's data stack — nontainer presets grant these
    # opportunistically; the studio wants them out of the box
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    # NOTE: no kaleido — plotly's fig.write_image can't run inside the
    # sandbox (kaleido validates the Chrome binary path and builds temp
    # dirs through the VFS, then needs a real Chrome subprocess). The
    # primer steers agents to matplotlib for static images.
    "plotly",
    # provider SDKs: anthropic + openai cover the default detection
    # order (openai also carries OpenRouter and OpenAI-compatible
    # endpoints); google/ollama SDKs are opt-in installs
    "anthropic",
    "openai",
    # agno's compression watermark counts tokens; without these it
    # falls back to a chars/4 estimate and warns on every new model id
    "tiktoken",
    "tokenizers",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx2",  # starlette TestClient
]
# Powers NONTAINER_STUDIO_EXECUTOR=dud / dud-vm (real-machine / microVM
# execution via nontainer's DudExecutor). dud requires >=3.11; the
# marker keeps the studio's 3.10 floor for everyone not opting in.
dud = [
    # 0.3.0: an explicit `allow` per host object, which nontainer 0.3
    # passes unconditionally (`dud.public_methods(obj)`). Older duds
    # have neither the keyword nor the helper, so the pairing is a hard
    # break rather than a degraded rung — and studio depends on dud
    # DIRECTLY, so nontainer's own floor never reaches this extra.
    # 0.2.1 brought the guest workspace mounted AT /workspace — the
    # same absolute paths the local sandbox teaches.
    # 0.4.0 moved rich-value flattening out of the guest and into a
    # host-named `outputs_hook`, which nontainer 0.4 supplies. Raised
    # here as well as there BECAUSE studio depends on dud directly:
    # nontainer's own floor is on `nontainer[dud]`, which studio does
    # not install, so nothing else would stop a resolver handing this
    # extra a 0.3.x dud that the hook cannot reach.
    "dud>=0.4.0; python_version >= '3.11'",
]

[project.scripts]
nontainer-studio = "nontainer_studio.server:main"

[project.urls]
"Source" = "https://github.com/ashenfad/nontainer-studio"

# nontainer IS on PyPI (that's what the dependency above resolves to,
# and what CI tests against). The sibling link is a uv-only convenience
# for CO-DEVELOPMENT: the two repos are developed as one, so a local
# checkout sees core changes before they're released. pip ignores this
# table.
#
# Standing pin, unlike the sandtrap/dud entries that lived here for the
# /workspace root contract — those are retired: sandtrap and dud ship
# what studio needs (0.3.2 and 0.3.0 respectively) and resolve from PyPI
# like any other dependency. Both floors are stated through nontainer,
# except dud's, which studio must carry itself (see the [dud] extra).
[tool.uv.sources]
nontainer = { path = "../nontainer", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nontainer_studio"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
