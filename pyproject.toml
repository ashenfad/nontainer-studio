[project]
name = "nontainer-studio"
version = "0.0.1"
description = "A local AI workbench over nontainer: chat, versioned workspaces, live app preview."
readme = "README.md"
license = "MIT"
authors = [
    {name = "ashenfad"},
]
requires-python = ">=3.10"
dependencies = [
    # Floors on nontainer are hard: the studio speaks the current
    # surface with no compatibility layer. What each release changed
    # is in nontainer's changelog.
    "nontainer[agno,apps]>=0.10.0",
    # A turn that hits a provider error resumes in place through agno
    # 3's continue of an errored run; agno 2 has no such path, and the
    # nontainer extra alone only guarantees agno 2.1.
    "agno>=3.0",
    # session ids are minted slugs; the label a human reads is the title
    "petname>=2.6",
    "uvicorn>=0.30",
    # the agent's data stack, granted out of the box
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    # no kaleido: plotly's write_image needs a real Chrome subprocess,
    # which the sandbox cannot run; the primer steers static images to
    # matplotlib
    "plotly",
    # provider SDKs for the default detection order (openai also covers
    # OpenRouter and OpenAI-compatible endpoints); google and ollama are
    # opt-in installs
    "anthropic",
    "openai",
    # the `web` host object's calls to OpenRouter
    "httpx>=0.27",
]

[project.optional-dependencies]
# The agex loop (NONTAINER_STUDIO_LOOP=agex): unreleased while agex is
# rebuilt, so a git source below pins it.
agex = ["agex"]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx2",  # starlette TestClient
    # the browser tests; run `uv run playwright install chromium` once
    "playwright",
    # the tests drive both loops
    "agex",
]
# NONTAINER_STUDIO_EXECUTOR=dud / dud-vm. dud needs 3.11+; the marker
# keeps the 3.10 floor for everyone not opting in. The floor is stated
# here because the studio depends on dud directly, so nontainer's own
# dud floor never reaches this extra.
dud = [
    "dud>=0.4.0; python_version >= '3.11'",
]

[project.scripts]
nontainer-studio = "nontainer_studio.server:main"

[project.urls]
"Source" = "https://github.com/ashenfad/nontainer-studio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Until nontainer's next release the studio runs on a commit of its
# main, so the studio's use shakes out what is unreleased there. The
# lock isn't committed, so the commit is pinned here, and moved on by
# hand. At the release this goes, and the floor above rises to it.
nontainer = { git = "https://github.com/ashenfad/nontainer", rev = "59fe19349264f83d34caeb2fd839713ab266fd89" }
# agex is unreleased until its shape freeze; a commit of its rebuild
# branch, moved on by hand, as nontainer's above is.
agex = { git = "https://github.com/ashenfad/agex", rev = "7d92716409712f5b2871525c16677fbad75a9112" }

[tool.hatch.build.targets.wheel]
packages = ["nontainer_studio"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
